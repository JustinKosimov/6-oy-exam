<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pokemon Explorer — a responsive JavaScript project by Jasur Qosimov." />
    <title>Pokemon Explorer — Jasur Qosimov</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="back-link" href="/">← Portfolio</a>
      <img src="./pokemon-logo.png" alt="Pokemon" class="logo" />
      <span class="api-badge">PokeAPI</span>
    </header>

    <main class="shell">
      <section class="hero">
        <p class="eyebrow">6 oy exam / Pokemon Explorer</p>
        <h1>Find your <span>favorite</span> Pokemon.</h1>
        <p class="hero-copy">A responsive Pokemon catalog rebuilt with a current public API, live search and type filtering.</p>
      </section>

      <section class="controls" aria-label="Pokemon filters">
        <label class="search-field"><span>Search</span><input id="search" type="search" placeholder="Search by name..." autocomplete="off" /></label>
        <label><span>Type</span><select id="type-filter"><option value="all">All types</option></select></label>
        <label><span>Sort</span><select id="sort"><option value="id">Pokedex number</option><option value="name">Name A–Z</option></select></label>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Loading Pokemon...</p>
      <section id="pokemon-list" class="pokemon-grid" aria-live="polite"></section>
    </main>

    <footer class="footer"><span>Built with JavaScript</span><a href="https://pokeapi.co/" target="_blank" rel="noreferrer">Data from PokeAPI ↗</a></footer>
    <script src="./app.js"></script>
  </body>
</html>
